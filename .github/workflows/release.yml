# Signed release build (stub). Runs on version tags or by hand. The keystore comes from
# repository secrets and is never committed:
#   RELEASE_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Without them the job only explains what is missing. Publishing (GitHub Release,
# F-Droid, Play) is left for the maintainer to add.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed release APK + AAB
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Signing secrets missing
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::notice::Release signing secrets are not configured; nothing to build. See the header of .github/workflows/release.yml."

      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'

      - name: Set up JDK 21
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: env.HAS_KEYSTORE == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        if: env.HAS_KEYSTORE == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Test, then build signed APK and bundle
        if: env.HAS_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :core:test :data:testReleaseUnitTest :app:assembleRelease :app:bundleRelease

      - name: Remove keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release artifacts
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quest-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
