# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pin the exact SDK packages the build compiles against
      # (compileSdk 35 / build-tools 35.0.0, mirrored in gradle/libs.versions.toml).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, protocol, data incl. Room migrations under Robolectric, app, server)
        run: ./gradlew test --continue

      - name: Core coverage gate (>= 90% lines)
        run: ./gradlew :core:koverVerify :core:koverXmlReport

      - name: Android lint
        run: ./gradlew :data:lintDebug :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Compile instrumented tests
        run: ./gradlew :data:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Server distribution
        run: ./gradlew :server:installDist

      # Room discipline (CLAUDE.md): exported schemas must be committed, and
      # /schema (JSON Schema of the wire protocol) must match the DTOs.
      - name: Check generated files are committed
        run: |
          ./gradlew :protocol:generateSchemas
          if [ -n "$(git status --porcelain data/schemas schema)" ]; then
            echo "::error::Generated files are out of date — commit them:"
            git status --porcelain data/schemas schema
            git diff -- schema | head -200
            find data/schemas -name '*.json' -newer settings.gradle.kts -print -exec cat {} \;
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --redact --verbose
