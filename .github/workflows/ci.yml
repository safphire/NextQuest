name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pin the exact SDK packages the build compiles against
      # (compileSdk 35 / build-tools 35.0.0, mirrored in app/build.gradle.kts).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Room discipline (CLAUDE.md): exported schemas must be committed. Fails
      # when KSP generates a schema that differs from (or is missing in) git,
      # and prints the generated JSON so it can be committed.
      - name: Check committed Room schemas
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::app/schemas is out of date — commit the generated schema below"
            git status --porcelain app/schemas
            find app/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nextquest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
