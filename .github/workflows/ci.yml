# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pin the exact SDK packages the build compiles against
      # (compileSdk 35 / build-tools 35.0.0, mirrored in gradle/libs.versions.toml).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, protocol, data incl. Room migrations under Robolectric, app, server)
        run: ./gradlew :core:test :protocol:test :server:test :data:testDebugUnitTest :app:testDebugUnitTest --continue

      - name: Core coverage gate (>= 90% lines)
        run: ./gradlew :core:koverVerify :core:koverXmlReport

      - name: Android lint
        run: ./gradlew :data:lintDebug :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Compile instrumented tests
        run: ./gradlew :data:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Server distribution
        run: ./gradlew :server:installDist

      # Room discipline (CLAUDE.md): exported schemas must be committed, and
      # /schema (JSON Schema of the wire protocol) must match the DTOs.
      - name: Check generated files are committed
        run: |
          ./gradlew :protocol:generateSchemas
          if [ -n "$(git status --porcelain data/schemas schema)" ]; then
            echo "::error::Generated files are out of date — commit them:"
            git status --porcelain data/schemas schema
            git diff -- schema | head -200
            find data/schemas -name '*.json' -newer settings.gradle.kts -print -exec cat {} \;
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :data:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest

      # Room migration tests on a real SQLite, alarm re-arming with the real AlarmManager.
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore

  docker:
    name: Server image (docker compose up + /health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Throwaway password generated per run, so nothing secret-shaped lives in the repo.
      - name: Build and start
        run: |
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" > .env
          docker compose up -d --build
      - name: Health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose down -v

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="--all" --redact --verbose
